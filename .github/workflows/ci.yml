name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: contentdock_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: contentdock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contentdock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VIDEO_TEST_DATABASE_URL: postgres://contentdock_test:local-ci-only@127.0.0.1:5432/contentdock_test
      PUBLISHING_TEST_DATABASE_URL: postgres://contentdock_test:local-ci-only@127.0.0.1:5432/contentdock_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
